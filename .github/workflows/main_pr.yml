name: OpenRouter PR Agent
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    # Fixes the crash: Safely handles both PR openings AND slash comments while ignoring bot replies
    if: |
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' || 
       (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/')))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Run PR Agent
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          OPENAI_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENAI__KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENAI__API_BASE: "https://openrouter.ai/api/v1"
          CONFIG__MODEL: "openrouter/google/gemini-2.5-flash"
          CONFIG__FALLBACK_MODELS: '["openrouter/google/gemini-2.5-flash"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "100000"
