name: OpenRouter PR Agent
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Run PR Agent
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          
          # Auth credentials
          OPENAI_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENAI__KEY: ${{ secrets.OPENROUTER_KEY }}
          
          # Notice the extra trailing slash or standard fallback pattern for OpenRouter
          OPENAI__API_BASE: "https://openrouter.ai"
          
          # Configuration for model mapping
          CONFIG__MODEL: "openrouter/google/gemini-2.5-flash"
          CONFIG__FALLBACK_MODELS: '["openrouter/google/gemini-2.5-flash"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "100000"
